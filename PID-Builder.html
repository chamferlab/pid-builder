// Older projects had predefined ports. They are cleared once so every symbol is ported manually.
function migrateManualPorts(project) {
  if (project.portModeVersion === 3) return project;
  // Version 2 already has manual seal and instrument ports; migrate equipment only.
  const oldVersion = project.portModeVersion || 1;
  const changed = new Set();
  for (const n of project.nodes) {
    if ((oldVersion < 2 && manuallyPorted(n)) || specs[n.kind]?.group === 'equipment') {
      changed.add(n.id);
      n.ports = [];

  project.pipes = project.pipes.filter(p => !changed.has(p.a.node) && !changed.has(p.b.node));
  project.portModeVersion = 3;
  return project;
}

// When a media drawing has been redrawn at a different size, symbols saved with the old one
// take the new size, and their ports keep their relative positions.
function restoreSymbolAssets() {
  for (const n of state.nodes) {
    // The single seal used to be built in at 455 by 500; it is now a seal drawing like the others.
    if (n.kind === 'seal' && !n.sealVariant && !n.sealSvg && !state.sealSvg) {
      const single = specs[DEFAULT_SEAL], k = single.w / 455;
      for (const p of n.ports) { p.x = Math.round(p.x * k); p.y = Math.round(p.y * k); }
      Object.assign(n, {sealVariant: DEFAULT_SEAL, w: single.w, h: single.h, artworkSource: 'media', artworkVersion: single.version});

    const spec = specs[n.kind];
    if (n.artworkSource !== 'media' || !spec?.svg || n.artworkVersion === spec.version) continue;

    if (Number.isFinite(sx) && Number.isFinite(sy)) for (const p of n.ports) { p.x = Math.round(p.x * sx); p.y = Math.round(p.y * sy); }

let undoStack = [], redoStack = [], historyCurrent = null, historyGroup = null;

function updateHistoryButtons() {
  $('undo').disabled = undoStack.length === 0;
  $('redo').disabled = redoStack.length === 0;
}
function resetHistory() {
  undoStack = []; redoStack = []; historyCurrent = JSON.stringify(state); historyGroup = null;
  updateHistoryButtons();
}
function persist(group = null) {
  const data = JSON.stringify(state);
  if (historyCurrent !== null && data !== historyCurrent) {
    if (!group || historyGroup !== group) {
      undoStack.push(historyCurrent);
      if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
    }
    redoStack = []; historyCurrent = data; historyGroup = group;
  }
  updateHistoryButtons();
  try { localStorage.setItem(STORAGE_KEY, data); } catch { setStatus('Autosave full; use Save project'); }
}
function restoreHistory(isRedo = false) {
  // Finish a live drag before restoring, so it is also a single reversible action.
  if (JSON.stringify(state) !== historyCurrent) persist();
  const source = isRedo ? redoStack : undoStack, destination = isRedo ? undoStack : redoStack;
  if (!source.length) return;
  destination.push(historyCurrent);
  state = JSON.parse(source.pop());
  historyCurrent = JSON.stringify(state); historyGroup = null;
  const keepMode = mode === 'pipe' ? 'pipe' : 'select';
  resetInteraction(); mode = keepMode;
  render(); persist();
}

    line('M -48 0 H -22 M 23 0 H 48 M 22 -20 V 20') +
    `<path d="M -22 -18 L 20 0 L -22 18 Z" fill="#fff" stroke="${INK}" stroke-width="2.2" stroke-linejoin="round"/>`,
  drain: () => line('M 0 -45 V 16 M -18 16 H 18 M 0 16 V 38 M -9 29 L 0 38 L 9 29'),
  vent: () => line('M 0 45 V -16 M -18 -16 H 18 M 0 -16 V -38 M -9 -29 L 0 -38 L 9 -29'),
  // The cooler from before equipment moved to media/; drawings saved then still use it.
  cooler: () =>
    `<rect x="-75" y="-58" width="150" height="116" fill="#fff" stroke="${INK}" stroke-width="2.2"/>` +
    line('M -95 0 H -75 M 75 0 H 95 M 0 -75 V -58 M 0 58 V 75') +
    `<path d="M -65 -30 h19 q16 0 16 13 t-16 13 h-14 q-10 0 -10 12 t10 12 h20 q12 0 12 13 t-12 13 M 65 -30 H46 Q30 -30 30 -17 T46 -4 h14 q10 0 10 12 T60 20 H40 Q28 20 28 33 T40 46" fill="none" stroke="#168da5" stroke-width="3"/>` +
    line('M -75 -38 H75 M -75 38 H75', 1, ' stroke-dasharray="5 5"')
};

function instrumentArtwork(n) {
  const stubs = n.orientation === 'vertical' ? 'M 0 -45 V -32 M 0 32 V 45' : `M ${-n.w / 2} 0 H -32 M 32 0 H ${n.w / 2}`;
  return line(stubs, 2) + `<circle r="32" fill="#fff" stroke="${INK}" stroke-width="2.2"/>`;
}

function symbolMarkup(n) {
  if (n.kind === 'seal') return artworkImage(n, sealImage(n));
  const legacy = n.artworkSource !== 'media' && BUILT_IN_ARTWORK[n.kind];
  if (specs[n.kind]?.svg && !legacy) return artworkImage(n, specs[n.kind].svg);
  if (isInstrument(n.kind)) return instrumentArtwork(n);
  if (BUILT_IN_ARTWORK[n.kind]) return BUILT_IN_ARTWORK[n.kind](n);
  return `<rect x="${-n.w / 2}" y="${-n.h / 2}" width="${n.w}" height="${n.h}" fill="#fff" stroke="${INK}" stroke-width="2.2"/>`;
}

// Small palette icons for symbols whose full artwork is too detailed at thumbnail size.

  nitrogen: '<rect x="10" y="8" width="20" height="27" rx="2"/><path d="M 10 18 H 30 M 20 2 V 8 M 15 3 H 25"/>'

function paletteGlyph(kind) {
  const spec = specs[kind];
  if (PALETTE_GLYPHS[kind]) return `<svg viewBox="0 0 40 40" xmlns="${NS}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${PALETTE_GLYPHS[kind]}</svg>`;
  if (spec.svg) return `<img src="${spec.svg}" alt="">`;
  return `<span class="bubble${kind.length > 2 ? ' long' : ''}">${escapeHtml(kind)}</span>`;
}

// Canvas rendering. The pipe and overlay layers are redrawn on every change; symbol elements
// are kept between renders so embedded artwork is not decoded again while dragging.

const layers = {};
const nodeElements = new Map();

function buildCanvas() {
  svg.innerHTML =
    `<defs><pattern id="grid" width="${GRID_SIZE}" height="${GRID_SIZE}" patternUnits="userSpaceOnUse"><path d="M ${GRID_SIZE} 0 L 0 0 0 ${GRID_SIZE}" fill="none" stroke="#e6edf2" stroke-width="1"/></pattern></defs>` +
    '<rect x="-20000" y="-20000" width="40000" height="40000" fill="#fff"/>' +
    '<rect class="editor-only" x="-20000" y="-20000" width="40000" height="40000" fill="url(#grid)"/>';
  layers.sheet = mk('g', {id: 'sheetFrame', 'pointer-events': 'none'}, svg);
  layers.pipes = mk('g', {id: 'pipes'}, svg);
  layers.nodes = mk('g', {id: 'nodes'}, svg);
  layers.overlay = mk('g', {id: 'overlay', class: 'editor-only'}, svg);
  nodeElements.clear();
}

function setStatus(text) { $('status').textContent = text; }
function statusText() {
  if (mode === 'addPort') return 'Click a symbol where the port belongs · Esc to cancel';
  if (pending) return 'Click another port, symbol, or pipe to connect · Esc to cancel';
  if (mode === 'pipe') return 'Pipe tool: click a symbol, port, or pipe to start · Esc to finish';
  if (selected?.type === 'nodes') return `${selected.ids.length} symbols selected`;
  return 'Ready';
}

// Redraws the sheet only. Used while dragging and typing, so the properties panel keeps its focus.
function renderCanvas() {
  svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  svg.setAttribute('class', `mode-${mode}${pending ? ' connecting' : ''}`);
  renderPipes();
  renderNodes();
  renderSheet();
  renderOverlay();
  $('sheetTitle').textContent = $('templateBarName').textContent = state.title;
}
function render() {
  renderCanvas();
  $('count').textContent = `${state.nodes.length} symbols · ${state.pipes.length} pipes`;
  $('zoomReset').textContent = `${Math.round(HOME_VIEW.w / view.w * 100)}%`;
  $('emptyHint').hidden = state.nodes.length > 0;
  $('templateBar').hidden = !state.templateId;
  document.body.classList.toggle('editing-template', !!state.templateId);
  setStatus(statusText());
  for (const [id, toolMode] of [['toolSelect', 'select'], ['toolPipe', 'pipe'], ['addSealPort', 'addPort']]) {
    $(id).classList.toggle('active', mode === toolMode);
    $(id).setAttribute('aria-pressed', String(mode === toolMode));
  }
  renderProperties();
}
const renderCanvasOnly = renderCanvas;

function renderPipes() {
  const layer = layers.pipes;
  layer.replaceChildren();
  for (const p of state.pipes) {
    const r = pipeRoute(p);
    if (!r) continue;
    const g = r.g, isSelected = selected?.type === 'pipe' && selected.id === p.id, color = pipeColor(p);
    const shown = g.display || g.path;
    if (isSelected) mk('path', {d: shown, class: 'wire-halo editor-only'}, layer);
    mk('path', {
      d: shown, class: `wire${isSelected ? ' selected' : ''}`, fill: 'none', stroke: color, 'stroke-width': 2.6,
      'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke',
      ...(p.service === 'instrument-air' ? {'stroke-dasharray': '9 6'} : {})
    }, layer);
    const arrow = pipeArrow(g, p.direction);
    if (arrow) mk('path', {d: arrow, class: 'flow-arrow', fill: color, 'pointer-events': 'none'}, layer);
    mk('path', {d: g.path, class: 'wire hit editor-only', 'data-pipe': p.id}, layer);
    const label = String(p.lineNumber || '').trim(), labelPoint = label && lineLabelPoint(g.points);
    if (labelPoint) {
      mk('text', {
        x: labelPoint.x, y: labelPoint.y, class: 'line-label', 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700,
        'font-family': 'Arial,sans-serif', fill: DEFAULT_PIPE_COLOR, stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', 'pointer-events': 'none'
      }, layer).textContent = label;
    }
    if (isSelected) renderPipeHandles(p, r, layer);
  }
}

function renderPipeHandles(p, {a, b, g}, layer) {
  const handle = (at, attrs) => mk('circle', {cx: at.x, cy: at.y, r: 7}, mk('g', {...attrs, class: `bend-handle editor-only ${attrs.class || ''}`}, layer));
  if (g.elbow) {
    if (a.x !== b.x && a.y !== b.y) handle(g.corner, {class: 'elbow-handle', 'data-elbow': p.id});
  } else if (g.waypoints) {
    p.route.waypoints.forEach((corner, index) => handle(corner, {class: 'waypoint-handle', 'data-waypoint': index, 'data-pipe-id': p.id}));
  } else if (g.axis) {
    mk('path', {d: `M ${g.c1.x} ${g.c1.y} L ${g.c2.x} ${g.c2.y}`, class: 'bend-hit editor-only', 'data-route': p.id}, layer);
    for (const corner of [g.c1, g.c2]) handle(corner, {'data-route': p.id});
  } else {
    // An automatic route with another shape: dragging a corner turns its bends into waypoints.
    g.points.slice(1, -1).forEach((corner, index) => handle(corner, {class: 'waypoint-handle', 'data-auto-corner': index, 'data-pipe-id': p.id}));
  }
}

function captionMarkup(n) {
  const bounds = nodeBounds(n), scale = nodeScale(n), instrument = isInstrument(n.kind);
  // Instruments inserted into a vertical line carry their caption beside the bubble.
  const beside = instrument && ((n.orientation === 'vertical') !== ((n.rotation || 0) % 180 !== 0));
  // A numbered instrument shows its type above its loop number, as in PI over 101.
  const number = instrument ? String(n.number ?? '').trim() : '';
  const letters = (y, size, text, cls) => `<text class="${cls}" y="${y * scale}" text-anchor="middle" font-size="${size * scale}" font-family="Arial,sans-serif" fill="${INK}" font-weight="600" pointer-events="none">${escapeHtml(text)}</text>`;
  const long = n.kind.length > 2;
  const bubble = !instrument ? ''
    : number ? letters(-3, long ? 15 : 19, n.kind, 'tag-type') + letters(17, number.length > 4 ? 12 : 15, number, 'tag-number')
    : letters(7, long ? 17 : 22, n.kind, 'tag-type');
  // A caption that only repeats the bubble letters adds nothing.
  const caption = instrument && String(n.tag).trim() === n.kind ? '' : n.tag;
  return bubble + `<text class="caption" x="${beside ? bounds.w / 2 + 14 : 0}" y="${beside ? 5 : bounds.h / 2 + 27}" text-anchor="${beside ? 'start' : 'middle'}" font-size="14" font-family="Arial,sans-serif" font-weight="600" fill="#345166" pointer-events="none">${escapeHtml(caption)}</text>`;
}

// The drawing frame and title block. They follow the export area, so the sheet on screen is
// the sheet that is exported.
const TITLE_BLOCK = {w: 470, h: 92, inset: 12};
function sheetBox() {
  const s = exportSize(), i = TITLE_BLOCK.inset;
  return {l: s.x + i, t: s.y + i, r: s.x + s.w - i, b: s.y + s.h - i};
}
function renderSheet() {
  const layer = layers.sheet, info = sheetInfo();
  layer.replaceChildren();
  if (!info.frame) return;
  const f = sheetBox(), x = f.r - TITLE_BLOCK.w, y = f.b - TITLE_BLOCK.h, split = 44;
  const stroke = {fill: 'none', stroke: INK, 'stroke-width': 2, 'vector-effect': 'non-scaling-stroke'};
  mk('rect', {class: 'sheet-frame', x: f.l, y: f.t, width: f.r - f.l, height: f.b - f.t, ...stroke}, layer);
  const block = mk('g', {class: 'title-block', 'font-family': 'Arial,sans-serif'}, layer);
  mk('rect', {x, y, width: TITLE_BLOCK.w, height: TITLE_BLOCK.h, ...stroke, fill: '#fff'}, block);
  const cell = (label, value, cx, cy, width, size, name) => {
    mk('text', {x: cx + 8, y: cy + 13, 'font-size': 8, 'font-weight': 700, 'letter-spacing': .6, fill: '#6b7f90'}, block).textContent = label;
    // Text that would run over the cell border is cut short.
    const fit = Math.max(1, Math.floor((width - 16) / (size * .58))), text = String(value ?? '').trim();
    mk('text', {x: cx + 8, y: cy + 17 + size, 'font-size': size, 'font-weight': 600, fill: INK, 'data-sheet': name}, block).textContent =
      text.length > fit ? text.slice(0, fit - 1) + '…' : text;
  };
  cell('TITLE', state.title, x, y, TITLE_BLOCK.w, 17, 'title');
  mk('path', {d: `M ${x} ${y + split} H ${f.r}`, ...stroke, 'stroke-width': 1.2}, block);
  let cx = x;
  for (const [label, name, width] of [['DRAWING NO.', 'number', 160], ['REV', 'revision', 60], ['DATE', 'date', 110], ['DRAWN BY', 'author', 140]]) {
    if (cx > x) mk('path', {d: `M ${cx} ${y + split} V ${f.b}`, ...stroke, 'stroke-width': 1.2}, block);
    cell(label, info[name], cx, y + split, width, 13, name);
    cx += width;
  }
}
// Port labels such as LBI sit beside the port, clear of the pipe that leaves it.
function portLabelMarkup(n) {
  return n.ports.filter(p => p.label).map(p => {
    const q = transformPoint(n, p), facing = portFacing({node: n.id, port: p.id}), side = facing === 'L' ? -1 : 1;
    const y = facing === 'B' ? q.y + 17 : q.y - 8;
    return `<text class="port-label" x="${q.x + side * 8}" y="${y}" text-anchor="${side < 0 ? 'end' : 'start'}" font-size="13" font-family="Arial,sans-serif" font-weight="700" fill="${INK}" stroke="#fff" stroke-width="3" paint-order="stroke" pointer-events="none">${escapeHtml(p.label)}</text>`;
  }).join('');
}

function renderNodes() {
  const layer = layers.nodes, live = new Set();
  state.nodes.forEach((n, index) => {
    live.add(n.id);
    let el = nodeElements.get(n.id);
    if (!el) {
      el = mk('g', {'data-node': n.id});
      el.innerHTML = '<rect class="select-outline editor-only" rx="5"/><rect class="node-hit editor-only"/><g class="symbol-artwork"></g><g class="labels"></g><g class="ports editor-only"></g>';
      nodeElements.set(n.id, el);
    }
    if (layer.children[index] !== el) layer.insertBefore(el, layer.children[index] || null);
    const [outline, hit, artwork, labels, ports] = el.children, bounds = nodeBounds(n);
    el.setAttribute('class', `node${isNodeSelected(n.id) ? ' selected' : ''}`);
    el.setAttribute('transform', `translate(${n.x} ${n.y})`);
    for (const [k, v] of [['x', -bounds.w / 2 - 8], ['y', -bounds.h / 2 - 8], ['width', bounds.w + 16], ['height', bounds.h + 16]]) outline.setAttribute(k, v);
    // Line-art symbols are mostly empty space; the hit area makes the whole symbol clickable.
    for (const [k, v] of [['x', -bounds.w / 2], ['y', -bounds.h / 2], ['width', bounds.w], ['height', bounds.h]]) hit.setAttribute(k, v);
    artwork.setAttribute('transform', nodeTransform(n));
    // Rebuild artwork only when what it shows changes.
    const image = n.kind === 'seal' ? sealImage(n) : null;
    const connected = new Set(connectedPorts(n));
    const key = [n.kind, n.sealVariant, n.w, n.h, n.orientation, n.artworkSource, n.kind === 'junction' ? [...connected] : ''].join('|');
    if (el.artworkKey !== key || el.artworkImage !== image) {
      artwork.innerHTML = symbolMarkup(n);
      el.artworkKey = key; el.artworkImage = image;
    }
    labels.innerHTML = captionMarkup(n) + portLabelMarkup(n);
    ports.replaceChildren();
    for (const p of n.ports) {
      const q = transformPoint(n, p), isPending = pending?.node === n.id && pending.port === p.id;
      const port = mk('g', {
        class: `port editor-only${connected.has(p.id) ? ' connected' : ''}${isPending ? ' pending' : ''}`,
        transform: `translate(${q.x} ${q.y})`, 'data-node': n.id, 'data-port': p.id
      }, ports);
      mk('circle', {class: 'port-hit', r: 11}, port);
      mk('circle', {class: 'port-dot', r: 5}, port);
    }
  });
  for (const [id, el] of nodeElements) if (!live.has(id)) { el.remove(); nodeElements.delete(id); }
}

function renderOverlay() {
  const layer = layers.overlay;
  layer.replaceChildren();
  if (pending && drag?.type === 'connect') {
    const a = portPos(pending), node = byId(pending.node);
    if (a) mk('path', {id: 'preview', d: pipeGeometry(a, drag.cursor, null, {da: portFacing(pending), boxA: nodeBox(node)}).path, class: 'wire preview', 'pointer-events': 'none'}, layer);
  }
  for (const guide of drag?.guides || []) {
    mk('line', {class: `align-guide ${guide.type}`, x1: guide.x1, y1: guide.y1, x2: guide.x2, y2: guide.y2, 'pointer-events': 'none'}, layer);
  }
  if (drag?.type === 'marquee') {
    const {start, cursor} = drag;
    mk('rect', {class: 'marquee', x: Math.min(start.x, cursor.x), y: Math.min(start.y, cursor.y), width: Math.abs(cursor.x - start.x), height: Math.abs(cursor.y - start.y)}, layer);
  }
  showInsertionPreview(insertionPreview);
}

function showInsertionPreview(target) {
  insertionPreview = target;
  svg.querySelector('#insertionPreview')?.remove();
  if (!target) return;
  const half = target.size / 2, group = mk('g', {id: 'insertionPreview', class: 'editor-only', 'pointer-events': 'none'}, layers.overlay);
  mk('path', {d: target.vertical ? `M ${target.x} ${target.y - half} V ${target.y + half}` : `M ${target.x - half} ${target.y} H ${target.x + half}`, stroke: '#099aa4', 'stroke-width': 8, opacity: .45}, group);
  mk('circle', {cx: target.x, cy: target.y, r: 32, fill: '#e1f9f8', 'fill-opacity': .6, stroke: '#099aa4', 'stroke-width': 2, 'stroke-dasharray': '5 4'}, group);
  mk('text', {x: target.x + 42, y: target.y - 42, fill: '#087982', 'font-size': 15, 'font-weight': 650}, group).textContent =
    target.kind === 'junction' ? 'Insert junction' : specs[target.kind]?.inline ? 'Insert valve' : 'Insert instrument';
}

// Properties panel for the current selection.

const pressed = on => `aria-pressed="${on ? 'true' : 'false'}"`;
const field = (label, id, value, attrs = '') =>
  `<label class="field" for="${id}">${label}</label><input class="text" id="${id}" value="${escapeHtml(value)}" ${attrs}>`;

function renderProperties() {
  const box = $('properties');
  if (selected?.type === 'nodes' && selectedNodes().length < 2) { selectNodeIds(selectedNodes().map(n => n.id)); return; }
  if (selected?.type === 'pipe' && !pipeById(selected.id)) selected = null;
  if (selected?.type === 'node' && !byId(selected.id)) selected = null;
  if (!selected) renderDrawingProperties(box);
  else if (selected.type === 'nodes') renderGroupProperties(box);
  else if (selected.type === 'pipe') renderPipeProperties(box, pipeById(selected.id));
  else renderNodeProperties(box, byId(selected.id));
}

function renderDrawingProperties(box) {
  box.innerHTML = `
    <div class="panel-title">Drawing</div>
    ${field('Title', 'titleEdit', state.title)}
    <div class="field-grid">
      <div>${field('Drawing no.', 'sheetNumber', sheetInfo().number || '', 'data-sheet-field="number"')}</div>
      <div>${field('Revision', 'sheetRevision', sheetInfo().revision || '', 'data-sheet-field="revision"')}</div>
      <div>${field('Date', 'sheetDate', sheetInfo().date || '', 'type="date" data-sheet-field="date"')}</div>
      <div>${field('Drawn by', 'sheetAuthor', sheetInfo().author || '', 'data-sheet-field="author"')}</div>
    </div>
    <label class="check"><input type="checkbox" id="sheetFrameToggle" ${sheetInfo().frame ? 'checked' : ''}> Frame and title block</label>
    ${templatePanelMarkup()}
    <div class="panel-title">How to draw</div>
    <ol class="steps">
      <li>Drag symbols from the palette onto the sheet.</li>
      <li>Choose <b>Pipe</b>, then click where a pipe starts and where it ends. Clicking a symbol creates a port there; clicking a pipe tees into it.</li>
      <li>Drop a valve, instrument, or junction onto a pipe to insert it.</li>
      <li>Select a pipe to set its line number, colour, flow arrow, and route.</li>
    </ol>
    <div class="panel-title">Shortcuts</div>
    <dl class="keys">
      <dt>P</dt><dd>Pipe tool</dd><dt>V / Esc</dt><dd>Select tool</dd>
      <dt>Shift-click</dt><dd>Add to selection</dd><dt>Shift-drag</dt><dd>Select an area</dd>
      <dt>Arrows</dt><dd>Nudge (Shift: one grid step)</dd><dt>Ctrl+D</dt><dd>Duplicate</dd>
      <dt>R</dt><dd>Rotate selected symbol</dd><dt>F</dt><dd>Zoom to fit</dd>
      <dt>Alt</dt><dd>Ignore snapping · Alt-click a port or bend to remove it</dd>
      <dt>Alt-drag</dt><dd>Pull a valve or instrument out of its line</dd>
    </dl>`;
  $('titleEdit').oninput = e => { state.title = e.target.value; renderCanvasOnly(); persist('titleEdit'); };
  const sheet = () => state.sheet ||= {frame: false, number: '', revision: '', date: '', author: ''};
  box.querySelectorAll('[data-sheet-field]').forEach(input => input.oninput = () => {
    sheet()[input.dataset.sheetField] = input.value; renderCanvasOnly(); persist('sheet:' + input.id);
  });
  wireTemplatePanel(box);
  $('sheetFrameToggle').onchange = e => { sheet().frame = e.target.checked; renderCanvasOnly(); persist(); };
}

function renderGroupProperties(box) {
  const nodes = selectedNodes();
  const align = (key, label, title) => `<button class="button" data-align="${key}" title="${title}">${label}</button>`;
  box.innerHTML = `
    <div class="info"><b>${nodes.length} symbols selected</b><br>Drag any of them to move the group. Shift-click adds or removes a symbol.</div>
    <div class="panel-title">Align to ${escapeHtml(nodes[0].tag || nodes[0].kind)}</div>
    <div class="button-grid three">
      ${align('x:start', 'Left', 'Align left edges')}${align('x:center', 'Center X', 'Align horizontal centers')}${align('x:end', 'Right', 'Align right edges')}
      ${align('y:start', 'Top', 'Align top edges')}${align('y:center', 'Center Y', 'Align vertical centers')}${align('y:end', 'Bottom', 'Align bottom edges')}
    </div>
    <div class="panel-title">Actions</div>
    <div class="button-grid">
      <button class="button" id="duplicateGroup">Duplicate</button>
      <button class="button danger" id="deleteSelected">Delete</button>
    </div>
    <button class="button block" id="saveTemplate" title="Keep these symbols and the pipes between them for reuse">Save as template</button>`;
  box.querySelectorAll('[data-align]').forEach(button => button.onclick = () => { const [axis, edge] = button.dataset.align.split(':'); alignSelected(axis, edge); });
  $('duplicateGroup').onclick = e => duplicateSelectedNodes(e.altKey);
  $('saveTemplate').onclick = saveSelectionAsTemplate;
  $('deleteSelected').onclick = deleteSelected;
}

function renderPipeProperties(box, p) {
  const r = pipeRoute(p);
  if (!r) { selected = null; renderDrawingProperties(box); return; }

// Edits to the drawing: symbols, ports, pipes, and inline insertion.

function setMode(next) {
  mode = mode === next ? 'select' : next;
  pending = null; drag = null;
  render();
}

function createNode(kind, x, y, commit = true, bypassSnap = false) {
  const spec = specs[kind];
  if (!spec) return;
  const variant = spec.group === 'seal' && kind !== 'seal';
  const n = {id: nextId(), kind: variant ? 'seal' : kind, x: snapCoordinate(x, bypassSnap), y: snapCoordinate(y, bypassSnap), w: spec.w, h: spec.h, tag: spec.tag ?? kind, notes: '', ports: defaultPorts(kind)};
  if (variant) n.sealVariant = kind;
  if (isInstrument(kind)) n.number = nextTagNumber(kind);
  if (spec.svg) { n.artworkSource = 'media'; n.artworkVersion = spec.version; }
  state.nodes.push(n);
  selected = {type: 'node', id: n.id};
  pending = null; drag = null; mode = 'select';
  showInsertionPreview(null);
  render();
  if (commit) persist();
  return n;
}
// Places a symbol in the middle of the view, stepping aside if one is already there.
function createNodeAtCenter(kind, bypassSnap = false) {
  let x = view.x + view.w / 2, y = view.y + view.h / 2;
  const occupied = () => state.nodes.some(n => Math.abs(n.x - snapCoordinate(x, bypassSnap)) < 1 && Math.abs(n.y - snapCoordinate(y, bypassSnap)) < 1);
  while (occupied()) { x += 2 * GRID_SIZE; y += 2 * GRID_SIZE; }
  return createNode(kind, x, y, true, bypassSnap);
}

function duplicateNode(n, bypassSnap = false) {
  const copy = structuredClone(n);
  copy.id = nextId();
  copy.x = snapCoordinate(copy.x + 45, bypassSnap); copy.y = snapCoordinate(copy.y + 45, bypassSnap);
  if (copy.number) copy.number = nextTagNumber(copy.kind);
  state.nodes.push(copy);
  selected = {type: 'node', id: copy.id};
  render(); persist();
}
// Adds copies of symbols and the pipes between them, moved by an offset, and selects the copies.
function addCopies(nodes, sourcePipes, dx, dy) {
  const ids = new Map(), lineIds = new Map(), copies = [];
  for (const n of nodes) {
    const copy = structuredClone(n);
    copy.id = nextId(); copy.x += dx; copy.y += dy;
    ids.set(n.id, copy.id); copies.push(copy);
  }
  const pipes = sourcePipes.filter(p => ids.has(p.a.node) && ids.has(p.b.node)).map(p => {
    const copy = structuredClone(p);
    copy.id = nextId(); copy.a.node = ids.get(p.a.node); copy.b.node = ids.get(p.b.node); copy.route = shiftedRoute(p.route, dx, dy);
    if (!lineIds.has(lineKey(p))) lineIds.set(lineKey(p), copy.id);
    copy.lineId = lineIds.get(lineKey(p));
    return copy;
  });
  // Pushed one at a time so each numbered copy takes the next free tag number.
  for (const copy of copies) { if (copy.number) copy.number = nextTagNumber(copy.kind); state.nodes.push(copy); }
  state.pipes.push(...pipes);
  selected = copies.length > 1 ? {type: 'nodes', ids: copies.map(n => n.id)} : copies.length ? {type: 'node', id: copies[0].id} : null;
}
// Copies the selected symbols together with the pipes that run between them.
function duplicateSelectedNodes(bypassSnap = false) {
  const nodes = selectedNodes();
  if (nodes.length < 2) return;
  addCopies(nodes, state.pipes, snapCoordinate(nodes[0].x + 45, bypassSnap) - nodes[0].x, snapCoordinate(nodes[0].y + 45, bypassSnap) - nodes[0].y);
  render(); persist();
}
function duplicateSelection(bypassSnap = false) {
  const nodes = selectedNodes();
  if (nodes.length > 1) duplicateSelectedNodes(bypassSnap);
  else if (nodes.length === 1) duplicateNode(nodes[0], bypassSnap);
}

function deleteSelected() {
  if (!selected) return;
  if (selected.type === 'pipe') state.pipes = state.pipes.filter(p => p.id !== selected.id);
  else {
    const ids = new Set(selectedNodeIds());
    // A symbol sitting in a line is taken out of it; the line itself stays.
    for (const n of selectedNodes()) if (pipesOnNode(n.id).every(p => !ids.has(p.a.node === n.id ? p.b.node : p.a.node))) detachFromLine(n);
    state.nodes = state.nodes.filter(n => !ids.has(n.id));
    state.pipes = state.pipes.filter(p => !ids.has(p.a.node) && !ids.has(p.b.node));
  }
  selected = null;
  render(); persist();
}

// Aligns the selection to its first symbol, which stays where it is.
function alignSelected(axis, edge) {
  const nodes = selectedNodes();
  if (nodes.length < 2) return;
  const offset = n => { const b = nodeBounds(n), size = axis === 'x' ? b.w : b.h; return edge === 'start' ? -size / 2 : edge === 'end' ? size / 2 : 0; };
  const target = nodes[0][axis] + offset(nodes[0]);
  for (const n of nodes.slice(1)) n[axis] = Math.round(target - offset(n));
  render(); persist();
}

// Moves the selected symbols, carrying the routes of pipes that run between them.
function moveSelection(dx, dy, group) {
  const nodes = selectedNodes(), ids = new Set(nodes.map(n => n.id));
  if (!nodes.length) return;
  for (const n of nodes) { n.x += dx; n.y += dy; }
  for (const p of state.pipes) if (ids.has(p.a.node) && ids.has(p.b.node)) p.route = shiftedRoute(p.route, dx, dy);
  render(); persist(group);
}

function applyTransform() { showInsertionPreview(null); render(); persist(); }
function rotateNode(n, degrees) { n.rotation = ((n.rotation || 0) + degrees) % 360; applyTransform(); }

// ---- Ports and pipes ----

// Adds a port to a symbol at a canvas position and returns its id.
function addPortAt(n, world) {
  const p = transformPoint(n, {x: world.x - n.x, y: world.y - n.y}, true);
  let number = 1;
  while (n.ports.some(port => port.id === `P${number}`)) number++;
  n.ports.push({id: `P${number}`, x: Math.round(p.x), y: Math.round(p.y), custom: true});
  return `P${number}`;
}
function removePort(nodeId, portId) {
  const n = byId(nodeId);
  if (!portEditable(n) || !n.ports.some(p => p.id === portId)) return;
  n.ports = n.ports.filter(p => p.id !== portId);
  state.pipes = state.pipes.filter(p => !(p.a.node === nodeId && p.a.port === portId) && !(p.b.node === nodeId && p.b.port === portId));
  pending = null; drag = null;
  render(); persist();
}

const sameRef = (p, q) => p.node === q.node && p.port === q.port;

// The port of a junction that a new branch should use: an unconnected one facing the given point.
function branchPort(junction, towards) {
  if (!junction.ports.length) junction.ports = structuredClone(JUNCTION_PORTS);
  const used = new Set(pipesOnNode(junction.id).map(p => p.a.node === junction.id ? p.a.port : p.b.port));
  const free = junction.ports.filter(p => !used.has(p.id));
  if (!free.length) return null;
  const facing = p => { const q = transformPoint(junction, p); return q.x * (towards.x - junction.x) + q.y * (towards.y - junction.y); };
  return free.reduce((best, p) => facing(p) > facing(best) ? p : best).id;
}
// While a branch is being drawn from a junction, it leaves from the side nearest the pointer.
function aimPendingBranch(towards) {
  if (!pending?.branch) return;
  const port = branchPort(byId(pending.node), towards);
  if (port) pending.port = port;
}

// Joins the pending port to another one. Returns false if the two cannot be connected.
function connectPending(ref) {
  if (!pending || pending.node === ref.node) return false;
  aimPendingBranch(portPos(ref) || byId(ref.node));
  const from = {node: pending.node, port: pending.port};
  const exists = state.pipes.some(p => (sameRef(p.a, from) && sameRef(p.b, ref)) || (sameRef(p.b, from) && sameRef(p.a, ref)));
  if (!exists) {
    const pipeId = nextId();
    state.pipes.push({id: pipeId, lineId: pipeId, a: from, b: ref});
  }
  pending = null; drag = null;
  render(); persist();
  return true;
}
// A click or drag on a port: starts a connection, or completes the one in progress.
function beginPipe(nodeId, portId, e) {
  e.stopPropagation();
  const ref = {node: nodeId, port: portId};
  if (e.altKey && portEditable(byId(nodeId))) { removePort(nodeId, portId); return; }
  if (!pending) {
    pending = ref;
    drag = {type: 'connect', cursor: point(e), sx: e.clientX, sy: e.clientY, moved: false};
    render();
    return;
  }
  if (sameRef(pending, ref)) { pending = null; drag = null; render(); return; }
  if (!connectPending(ref)) setStatus('Choose a port on another symbol');
}
// A click on a symbol's artwork while piping: creates a port there and uses it.
function pipeFromSymbol(n, e) {
  if (!portEditable(n)) return;
  if (pending && pending.node === n.id) { setStatus('Choose a port on another symbol'); return; }
  const world = point(e);
  if (n.kind === 'junction') { pipeFromJunction(n, world, e); return; }
  const ref = {node: n.id, port: addPortAt(n, world)};
  if (pending) { connectPending(ref); return; }
  pending = ref;
  drag = {type: 'connect', cursor: world, sx: e.clientX, sy: e.clientY, moved: false};
  render(); persist();
}
// Junctions offer their unconnected ports instead of taking a new one where they are clicked.
function pipeFromJunction(junction, world, e) {
  const source = pending && portPos(pending), port = branchPort(junction, source || world);
  if (!port) { setStatus('This junction has no free port'); return; }
  if (pending) { connectPending({node: junction.id, port}); return; }
  pending = {node: junction.id, port, branch: true};
  drag = {type: 'connect', cursor: world, sx: e.clientX, sy: e.clientY, moved: false};
  render(); persist();
}
// A click on a pipe while piping: tees into it with a new junction and branches from there.
function pipeFromPipe(pipeId, e) {
  const world = point(e), target = insertionTarget('junction', world, null, pipeId);
  if (!target) { setStatus('Not enough straight pipe here for a tee; click a longer straight run'); return; }
  // Keep the tee on whole units along the pipe.
  if (target.vertical) target.y = Math.round(target.y); else target.x = Math.round(target.x);
  const spec = specs.junction, keep = {pending, selected};
  const junction = {id: nextId(), kind: 'junction', x: target.x, y: target.y, w: spec.w, h: spec.h, tag: spec.tag, notes: '', ports: []};
  state.nodes.push(junction);
  insertInlineSymbol(junction, target);
  pending = keep.pending; selected = keep.selected;
  pipeFromJunction(junction, world, e);
}

// ---- Inline insertion ----

// Finds a straight pipe segment under a point with room for an inline symbol and short leads.
// onlyPipeId restricts the search to one pipe.
function insertionTarget(kind, at, nodeId = null, onlyPipeId = null) {
  if (!isInsertable(kind) || (nodeId && pipesOnNode(nodeId).length)) return null;
  const tolerance = 14 / screenScale(), spec = specs[kind], symbol = nodeId ? byId(nodeId) : null;
  let best = null;
  for (const pipe of state.pipes) {
    const points = onlyPipeId && pipe.id !== onlyPipeId ? null : pipeRoute(pipe)?.points;
    if (!points) continue;
    for (let segment = 0; segment < points.length - 1; segment++) {
      const start = points[segment], end = points[segment + 1], vertical = start.x === end.x, axis = vertical ? 'y' : 'x';
      const length = Math.abs(end[axis] - start[axis]);
      const along = spec.inline ? (symbol?.w || spec.w) : vertical ? (symbol?.h || spec.h) : (symbol?.w || spec.w);
      const size = along * (symbol ? nodeScale(symbol) : 1), clearance = size / 2 + 12;
      if (length < clearance * 2) continue;
      const low = Math.min(start[axis], end[axis]), high = Math.max(start[axis], end[axis]);
      const projection = Math.max(low, Math.min(high, at[axis]));
      const distance = Math.hypot(vertical ? at.x - start.x : at.x - projection, vertical ? at.y - projection : at.y - start.y);
      if (distance > tolerance || (best && distance >= best.distance)) continue;
      const center = Math.max(low + clearance, Math.min(high - clearance, projection));
      const forward = end[axis] > start[axis];
      best = {
        kind, pipeId: pipe.id, segment, vertical, x: vertical ? start.x : center, y: vertical ? center : start.y,
        forward, flowForward: pipe.direction === 'reverse' ? !forward : forward, points: points.map(p => ({...p})), distance, size
      };
    }
  }
  return best;
}

// Takes an inline symbol out of its line: the two pipes meeting at it become one again, and
// the symbol is left unconnected. Returns false when the symbol is not simply in a line.
function detachFromLine(n) {
  const pipes = pipesOnNode(n.id);
  if (!isInsertable(n.kind) || pipes.length !== 2 || pipes.some(p => p.a.node === p.b.node)) return false;
  const [first, second] = pipes, portOf = p => p.a.node === n.id ? p.a.port : p.b.port;
  if (portOf(first) === portOf(second)) return false;
  // Both routes are read running through the symbol: into it along the first pipe, out along the second.
  const inward = first.b.node === n.id, outward = second.a.node === n.id;
  const through = (p, forward) => { const points = pipeRoute(p)?.points.slice(1, -1) || []; return forward ? points : points.reverse(); };
  const waypoints = [...through(first, inward), ...through(second, outward)];
  const flip = {forward: 'reverse', reverse: 'forward'};
  const joined = {
    ...first, a: inward ? first.a : first.b, b: outward ? second.b : second.a, route: {waypoints},
    ...(first.direction && !inward ? {direction: flip[first.direction]} : {})
  };

}
function storeTemplates() {
  try { localStorage.setItem(TEMPLATE_STORAGE, JSON.stringify(templates)); }
  catch { alert('The browser storage is full, so templates could not be saved. Export them to a file and remove some.'); }
  renderTemplates(); render();
}
// Built-in templates come with the application and cannot be changed; a placed copy can be saved as your own.
const templateById = id => templates.find(t => t.id === id) || BUILTIN_TEMPLATES.find(t => t.id === id);
const templateByName = name => templates.find(t => t.name.toLowerCase() === name.trim().toLowerCase());
const newTemplateId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// Copies the given symbols and the pipes running between them, centred on the origin.
function fragmentOf(nodes) {
  const ids = new Set(nodes.map(n => n.id)), boxes = nodes.map(nodeBox);
  const cx = Math.round((Math.min(...boxes.map(b => b.l)) + Math.max(...boxes.map(b => b.r))) / 2);
  const cy = Math.round((Math.min(...boxes.map(b => b.t)) + Math.max(...boxes.map(b => b.b))) / 2);
  return {
    nodes: nodes.map(n => ({...structuredClone(n), x: n.x - cx, y: n.y - cy})),
    pipes: state.pipes.filter(p => ids.has(p.a.node) && ids.has(p.b.node)).map(p => ({...structuredClone(p), route: shiftedRoute(p.route, -cx, -cy)}))
  };
}

// Saves a fragment under a name, replacing the template that already has that name.
function saveTemplate(name, fragment, id = null) {
  name = name.trim();
  const existing = templateById(id) || templateByName(name);
  if (existing) Object.assign(existing, fragment, {name});
  else templates.push({id: newTemplateId(), name, ...fragment});
  storeTemplates();
}
function saveSelectionAsTemplate() {
  const nodes = selectedNodes();
  if (!nodes.length) return;
  const name = prompt('Template name', nodes.length === 1 ? nodes[0].tag || '' : '')?.trim();
  if (!name) return;
  if (templateByName(name) && !confirm(`Replace the existing template “${templateByName(name).name}”?`)) return;
  saveTemplate(name, fragmentOf(nodes));
  setStatus(`Saved template ${name}`);
}

function placeTemplate(id, x, y, bypassSnap = false) {
  const t = templateById(id);
  if (!t) return;
  addCopies(t.nodes, t.pipes, snapCoordinate(x, bypassSnap), snapCoordinate(y, bypassSnap));
  restoreSymbolAssets();  // a template may predate redrawn artwork
  mode = 'select'; pending = null;
  render(); persist();
}

// A small drawing of the template, built by rendering it as if it were the whole drawing.
function templateThumbnail(t) {
  const keep = state;
  state = {...blankState(), nodes: t.nodes, pipes: t.pipes};
  try {
    const box = contentBox(), pad = 12;
    const pipes = t.pipes.map(p => { const r = pipeRoute(p); return r ? `<path d="${r.g.path}" fill="none" stroke="${pipeColor(p)}" stroke-width="2.6" vector-effect="non-scaling-stroke"/>` : ''; }).join('');
    const nodes = t.nodes.map(n => `<g transform="translate(${n.x} ${n.y})"><g transform="${nodeTransform(n)}">${symbolMarkup(n)}</g>${isInstrument(n.kind) ? captionMarkup({...n, tag: n.kind}) : ''}</g>`).join('');
    return `<svg xmlns="${NS}" viewBox="${box.l - pad} ${box.t - pad} ${box.r - box.l + 2 * pad} ${box.b - box.t + 2 * pad}" aria-hidden="true">${pipes}${nodes}</svg>`;
  } catch { return ''; }
  finally { state = keep; }
}

function templateTile(t) {
  const tile = document.createElement('button');
  tile.className = 'item template';
  tile.draggable = true;
  tile.dataset.template = t.id;
  tile.title = [t.name, t.detail, 'template'].filter(Boolean).join(' · ');
  tile.innerHTML = `<span class="glyph">${templateThumbnail(t)}</span><b>${escapeHtml(t.name)}</b>${t.detail ? `<small>${escapeHtml(t.detail)}</small>` : ''}`;
  tile.ondragstart = e => { e.dataTransfer.setData('text/plain', 'template:' + t.id); e.dataTransfer.effectAllowed = 'copy'; };
  tile.onclick = e => placeTemplate(t.id, view.x + view.w / 2, view.y + view.h / 2, e.altKey);
  return tile;
}
function renderTemplates() {
  const target = $('templatePalette');
  target.replaceChildren();
  if (!templates.length) target.innerHTML = '<p class="palette-hint">Select symbols on the sheet and choose <b>Save as template</b> to reuse them.</p>';
  for (const t of templates) target.appendChild(templateTile(t));
}
function renderBuiltinTemplates() {
  for (const t of BUILTIN_TEMPLATES) $('planPalette').appendChild(templateTile(t));
  $('planPalette').previousElementSibling.hidden = $('planPalette').hidden = !BUILTIN_TEMPLATES.length;
}

// ---- Editing a template ----
// The template is opened as a drawing of its own; the drawing that was open is set aside in
// browser storage and comes back when the template is saved or closed.

const editingTemplate = () => state.templateId || null;

function editTemplate(id) {
  const t = templateById(id);
  if (!t || editingTemplate()) return;
  try { localStorage.setItem(TEMPLATE_STASH, JSON.stringify(state)); }
  catch { alert('The browser storage is full, so the current drawing cannot be set aside. Save it to a file first.'); return; }
  state = {...blankState(), title: t.name, templateId: t.id};
  state.sheet.frame = false;
  resetInteraction();
  view = {...HOME_VIEW};
  addCopies(t.nodes, t.pipes, HOME_VIEW.w / 2, HOME_VIEW.h / 2);
  restoreSymbolAssets();
  selected = null;
  zoomToFit(); persist(); resetHistory();
}
// save: false closes without saving, true replaces the template being edited, and 'new' leaves
// that template as it was and saves the sheet as another one under the title.
function closeTemplate(save) {
  const id = editingTemplate();
  if (!id) return;
  if (save) {
    if (!state.nodes.length) { alert('A template needs at least one symbol.'); return; }
    const name = state.title.trim() || templateById(id)?.name || 'Template';
    const clash = templateByName(name);
    if (save === 'new' && clash) { alert(`A template is already called “${clash.name}”. Give this one another title first.`); return; }
    if (clash && clash.id !== id) { alert(`Another template is already called “${clash.name}”. Change the title first.`); return; }
    saveTemplate(name, fragmentOf(state.nodes), save === 'new' ? null : id);
  }
  let previous = null;
  try { previous = JSON.parse(localStorage.getItem(TEMPLATE_STASH)); localStorage.removeItem(TEMPLATE_STASH); } catch {}
  if (previous && Array.isArray(previous.nodes) && Array.isArray(previous.pipes)) loadProject(previous);
  else seed();
}
$('templateSave').onclick = () => closeTemplate(true);
$('templateSaveNew').onclick = () => closeTemplate('new');
$('templateClose').onclick = () => closeTemplate(false);

// ---- Template file ----

function exportTemplates() {
  download('seal-loop-templates.json', new Blob([JSON.stringify({type: TEMPLATE_FILE_TYPE, version: 1, templates}, null, 2)], {type: 'application/json'}));
}
// Imported templates are added to the library; one with the name of an existing template replaces it.
$('templateFile').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text()), incoming = data?.type === TEMPLATE_FILE_TYPE && Array.isArray(data.templates) ? data.templates.filter(validTemplate) : null;
    if (!incoming?.length) throw Error('This file contains no templates.');
    for (const t of incoming) {
      const existing = templateByName(t.name);
      if (existing) Object.assign(existing, {nodes: t.nodes, pipes: t.pipes});
      else templates.push({id: newTemplateId(), name: t.name.trim(), nodes: t.nodes, pipes: t.pipes});
    }
    storeTemplates();
    setStatus(`Imported ${incoming.length} template${incoming.length === 1 ? '' : 's'}`);
  } catch (err) { alert('Could not import templates: ' + err.message); }
  e.target.value = '';
};

// The template list in the Properties panel, shown with the drawing's own properties.
function templatePanelMarkup() {
  const rows = templates.map(t => `
    <div class="template-row" data-template-row="${t.id}">
      <input class="text" value="${escapeHtml(t.name)}" data-template-name="${t.id}" aria-label="Template name">
      <button class="button" data-template-edit="${t.id}" title="Open this template on the sheet to change it" ${editingTemplate() ? 'disabled' : ''}>Edit</button>
      <button class="button danger" data-template-delete="${t.id}" title="Delete this template">×</button>
    </div>`).join('');
  return `
    <div class="panel-title">Templates</div>
    ${rows || '<p class="note">None yet. Select symbols and choose Save as template.</p>'}
    <div class="button-grid">
      <button class="button" id="templatesExport" ${templates.length ? '' : 'disabled'} title="Download all templates as one file">Export</button>
      <button class="button" id="templatesImport" title="Add templates from a file">Import</button>
    </div>
    <p class="note">Templates are kept in this browser. Export them to back them up or share them.</p>`;
}
function wireTemplatePanel(box) {
  box.querySelectorAll('[data-template-name]').forEach(input => input.onchange = () => {
    const t = templateById(input.dataset.templateName), name = input.value.trim(), clash = templateByName(name);
    if (!t) return;
    if (!name || (clash && clash !== t)) { input.value = t.name; return; }
    t.name = name; storeTemplates();
  });
  box.querySelectorAll('[data-template-edit]').forEach(button => button.onclick = () => editTemplate(button.dataset.templateEdit));
  box.querySelectorAll('[data-template-delete]').forEach(button => button.onclick = () => {
    const t = templateById(button.dataset.templateDelete);
    if (!t || !confirm(`Delete the template “${t.name}”? Drawings that already use it are not affected.`)) return;
    templates = templates.filter(other => other !== t); storeTemplates();
  });
  $('templatesExport').onclick = exportTemplates;
  $('templatesImport').onclick = () => $('templateFile').click();
}

// Palette, toolbar wiring, and startup.

function buildPalette(group, target) {
  for (const [kind, spec] of Object.entries(specs)) {
    if (spec.group !== group || spec.hidden) continue;
    const tile = document.createElement('button');
    tile.className = 'item';
    tile.draggable = true;
    tile.dataset.kind = kind;
    tile.title = [spec.name, spec.detail].filter(Boolean).join(' · ');
    tile.innerHTML = `<span class="glyph">${paletteGlyph(kind)}</span><b>${escapeHtml(spec.name)}</b>${spec.detail && group === 'seal' ? `<small>${escapeHtml(spec.detail)}</small>` : ''}`;
    tile.ondragstart = e => { paletteDragKind = kind; e.dataTransfer.setData('text/plain', kind); e.dataTransfer.effectAllowed = 'copy'; };
    tile.ondragend = () => { paletteDragKind = null; showInsertionPreview(null); };
    tile.onclick = e => createNodeAtCenter(kind, e.altKey);
    $(target).appendChild(tile);
  }
}
buildPalette('seal', 'sealPalette');
buildPalette('instrument', 'instrumentPalette');
buildPalette('equipment', 'equipmentPalette');
renderTemplates();
renderBuiltinTemplates();

$('paletteSearch').oninput = e => {
  const query = e.target.value.trim().toLowerCase();
  for (const tile of document.querySelectorAll('.palette .item')) tile.hidden = !!query && !`${tile.title} ${tile.dataset.kind}`.toLowerCase().includes(query);
  for (const section of document.querySelectorAll('.palette .tiles')) section.previousElementSibling.hidden = !section.querySelector('.item:not([hidden])');
};

const canvasWrap = $('canvasWrap');
canvasWrap.ondragover = e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
  showInsertionPreview(insertionTarget(paletteDragKind, point(e)));
};
canvasWrap.ondragleave = e => { if (!canvasWrap.contains(e.relatedTarget)) showInsertionPreview(null); };
canvasWrap.ondrop = e => {
  e.preventDefault();
  const kind = e.dataTransfer.getData('text/plain');
  if (kind.startsWith('template:')) { const p = point(e); placeTemplate(kind.slice(9), p.x, p.y, e.altKey); }
  else if (specs[kind]) {
    const p = point(e), target = insertionTarget(kind, p);
    showInsertionPreview(null);
    const n = createNode(kind, p.x, p.y, false, e.altKey);
    if (target) insertInlineSymbol(n, target);
    render(); persist();
  }
  paletteDragKind = null;
  showInsertionPreview(null);
};

$('undo').onclick = () => restoreHistory();
$('redo').onclick = () => restoreHistory(true);

// Restore the autosaved drawing, keeping a one-time backup before migrating an old one.
buildCanvas();
try {
  const raw = localStorage.getItem(STORAGE_KEY), saved = JSON.parse(raw);
  if (saved && Array.isArray(saved.nodes) && Array.isArray(saved.pipes)) {
    if (saved.portModeVersion !== 3) {
      try { if (!localStorage.getItem(LEGACY_BACKUP_KEY)) localStorage.setItem(LEGACY_BACKUP_KEY, raw); } catch {}
    }
    state = migrateManualPorts(saved);
  } else seed();
} catch { seed(); }
restoreSymbolAssets();
render(); persist(); resetHistory();

})();
</script>
</body>
