<body>
<div class="app">
  <header>
    <div class="mark">P</div>
    <div class="brand"><strong>Seal Loop P&amp;ID Builder</strong><small id="count">0 symbols · 0 pipes</small></div>
    <div class="toolbar">
      <div class="group">
        <button id="undo" title="Undo (Ctrl/Cmd+Z)" disabled>↶ Undo</button>
        <button id="redo" title="Redo (Ctrl/Cmd+Shift+Z or Ctrl+Y)" disabled>↷ Redo</button>
      </div>
      <div class="group" id="fileGroup">
        <button id="newProject" title="Start with an empty canvas">New</button>

        <button id="saveProject" title="Download an editable project file (JSON)">Save</button>
      </div>
      <div class="group">
        <label title="Use your own SVG as a seal graphic. Replaces the selected seal, or adds a new one.">Import seal SVG<input id="sealFile" type="file" accept=".svg,image/svg+xml"></label>
      </div>
      <div class="group">
        <button id="exportSVG" class="accent">Export SVG</button>
        <button id="exportPNG" class="accent">Export PNG</button>
      </div>
    </div>
  </header>

  <aside class="palette">
    <input id="paletteSearch" class="text" type="search" placeholder="Search symbols" aria-label="Search symbols">
    <div class="section">Templates</div><div class="tiles seals" id="templatePalette"></div>
    <div class="section">Mechanical seals</div><div class="tiles seals" id="sealPalette"></div>
    <div class="section">Instruments</div><div class="tiles" id="instrumentPalette"></div>
    <div class="section">Equipment and piping</div><div class="tiles" id="equipmentPalette"></div>
  </aside>

  <main>
    <div class="canvas-head">
      <div class="tools" role="group" aria-label="Tools">
        <button id="toolSelect" title="Select and move (V)" aria-pressed="true">Select</button>
        <button id="toolPipe" title="Draw pipes: click a symbol or port, then another (P)" aria-pressed="false">Pipe</button>
        <button id="addSealPort" title="Place a connection port on a symbol without drawing a pipe" aria-pressed="false">+ Port</button>
      </div>
      <span class="sheet"><strong id="sheetTitle">Untitled seal loop</strong><span id="status">Ready</span></span>
      <div class="tools">
        <button id="snapGrid" title="Snap symbol centers to the 25-unit grid; hold Alt to place freely" aria-pressed="false">Snap to grid</button>
        <button id="zoomOut" title="Zoom out">−</button>
        <button id="zoomReset" title="Reset zoom">100%</button>
        <button id="zoomIn" title="Zoom in">+</button>
        <button id="zoomFit" title="Zoom to fit the drawing (F)">Fit</button>
      </div>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <svg id="drawing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" aria-label="P and ID drawing canvas"></svg>
      <div class="template-bar" id="templateBar" hidden>
        <span>Editing template <b id="templateBarName"></b></span>
        <button class="button" id="templateSave">Save template</button>
        <button class="button" id="templateClose">Close without saving</button>
      </div>
      <input id="templateFile" type="file" accept=".json,application/json" hidden>
      <div class="empty-hint" id="emptyHint"><b>Start by dragging a symbol onto the sheet</b>Then choose <kbd>Pipe</kbd> and click two symbols to connect them.</div>
    </div>
  </main>

  <aside class="inspector"><div id="properties"></div></aside>
</div>
